<svg width="680" height="390" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="390" fill="#ffffff"/>

  <!-- Network traffic -->
  <rect x="40" y="60" width="104" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="92" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Network</text>
  <text x="92" y="98" text-anchor="middle" font-size="12" fill="#444441">Raw packets</text>

  <!-- sniffer.py -->
  <rect x="164" y="60" width="110" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="219" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A1B0C">sniffer.py</text>
  <text x="219" y="98" text-anchor="middle" font-size="12" fill="#712B13">Rule engine</text>

  <!-- flow_tracker.py -->
  <rect x="294" y="60" width="152" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="370" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">flow_tracker.py</text>
  <text x="370" y="98" text-anchor="middle" font-size="12" fill="#085041">Groups packets</text>

  <!-- ml_detector.py -->
  <rect x="466" y="60" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="536" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">ml_detector.py</text>
  <text x="536" y="98" text-anchor="middle" font-size="12" fill="#085041">Scores flow</text>

  <!-- horizontal arrows -->
  <line x1="144" y1="88" x2="164" y2="88" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="274" y1="88" x2="294" y2="88" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="446" y1="88" x2="466" y2="88" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- diagonal arrows to db -->
  <path d="M219 116 L260 190" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M536 116 L386 190" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ids_logs.db -->
  <rect x="233" y="190" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="323" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#26215C">ids_logs.db</text>
  <text x="323" y="228" text-anchor="middle" font-size="12" fill="#3C3489">SQLite database</text>

  <line x1="323" y1="246" x2="323" y2="300" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- app.py -->
  <rect x="263" y="300" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="323" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">app.py</text>
  <text x="323" y="338" text-anchor="middle" font-size="12" fill="#444441">Flask server</text>

  <!-- Web browser -->
  <rect x="403" y="300" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="468" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Web browser</text>
  <text x="468" y="338" text-anchor="middle" font-size="12" fill="#444441">Live dashboard</text>

  <line x1="383" y1="328" x2="403" y2="328" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
